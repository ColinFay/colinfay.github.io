project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*/index.qmd"
    - "posts/*.qmd"
    - "!wikileaksdm/**"
    - "!osgridfolio/**"
  resources:
    - "CNAME"
    - "assets/**"
    - "pics/**"
    - "src/**"
    - "intro-to-r/**"
    - "r-data-import-export/**"
    - "r-internals/**"
    - "r-language-definition/**"
    - "r-installation-administration/**"
    - "writing-r-extensions/**"
    - "random/**"
    - "zee-you-user-2019/**"
    - "one-week-shiny-gogole-search/**"
    - "one-week-shiny-gogole-search.html"
    - "wikileaksdm/**"
    - "osgridfolio/**"
  post-render:
    - cp -f _site/index.xml _site/feed.xml
    - cp -f _extra/osgridfolio-index.html _site/osgridfolio/index.html

execute:
  enabled: false

website:
  title: "Colin Fay"
  description: "Mostly R, data, and code."
  site-url: "https://colinfay.me"
  favicon: /assets/favicon.png
  google-analytics: "UA-65307055-3"
  back-to-top-navigation: true
  page-navigation: false
  search:
    location: sidebar
    type: textbox
  sidebar:
    style: docked
    background: dark
    search: true
    collapse-level: 1
    header: |
      <div class="author-card">
        <img class="author-avatar" src="https://avatars.githubusercontent.com/u/17936236?s=300" alt="Colin Fay">
        <div class="author-name">Colin FAY</div>
        <div class="author-bio">Data Science and Engineering at <a href="https://thinkr.fr">ThinkR</a>. 'Chaotic good developer'. International Speaker. Runs. Eats plants.</div>
        <div class="nav-label">Navigation:</div>
      </div>
    contents:
      - text: "🏡 Home"
        href: index.qmd
      - text: "✍️ Blog"
        href: categories/index.qmd
      - text: "🤘 About"
        href: about/index.qmd
      - text: "📣 Talks & Publications"
        href: talks-publications/index.qmd
      - text: "💾 Open Source"
        href: open-source/index.qmd
      - text: "📕 Engineering Shiny"
        href: "https://engineering-shiny.org/"

format:
  html:
    theme: darkly
    css:
      - assets/css/terminal.css
      - assets/css/quarto-terminal-fixups.css
    highlight-style: github-dark
    toc: false
    grid:
      sidebar-width: 260px
      body-width: 900px
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:site" content="@_ColinFay">
