project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*/index.qmd"
    - "posts/*.qmd"
    - "!wikileaksdm/**"
    - "!osgridfolio/**"
  resources:
    - "CNAME"
    - "bio.txt"
    - "assets/**"
    - "pics/**"
    - "src/**"
    - "zee-you-user-2019/**"
    - "one-week-shiny-gogole-search/**"
    - "one-week-shiny-gogole-search.html"
    - "wikileaksdm/**"
    - "osgridfolio/**"
  post-render:
    - cp -f _site/index.xml _site/feed.xml
    - cp -f _extra/osgridfolio-index.html _site/osgridfolio/index.html

execute:
  enabled: false

website:
  title: "Colin Fay"
  description: "Mostly R, data, and code."
  site-url: "https://colinfay.me"
  favicon: /assets/favicon.png
  google-analytics: "UA-65307055-3"
  back-to-top-navigation: true
  page-navigation: false
  search:
    location: navbar
    type: overlay
  navbar:
    title: "colinfay.me"
    left:
      - text: "[home]"
        href: index.qmd
      - text: "[blog]"
        href: categories/index.qmd
      - text: "[about]"
        href: about/index.qmd
      - text: "[talks]"
        href: talks-publications/index.qmd
        aria-label: "Talks and publications"
      - text: "[oss]"
        href: open-source/index.qmd
        aria-label: "Open source"
      - text: "[book]"
        href: "https://engineering-shiny.org/"
        target: _blank
        aria-label: "Engineering Production-Grade Shiny Apps, the book"
    right:
      - text: "[rss]"
        href: /feed.xml
        aria-label: "RSS feed"
      - text: "[github]"
        href: "https://github.com/ColinFay"
        target: _blank
      - text: "[mastodon]"
        href: "https://fosstodon.org/@colinfay"
        target: _blank

format:
  html:
    theme: darkly
    css:
      - assets/css/terminal.css
      - assets/css/crt.css
    highlight-style: assets/css/crt.theme
    date-format: "YYYY-MM-DD"
    toc: false
    grid:
      sidebar-width: 0px
      margin-width: 0px
      body-width: 1300px
      gutter-width: 1.5rem
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=VT323&display=swap">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:site" content="@_ColinFay">
    include-after-body:
      - text: |
          <script src="/assets/js/crt.js"></script>
